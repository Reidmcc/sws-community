; Bomber Escort Fleet Battle: only the AI bomber creep can sink capital ships, and the players fight over them.
; Players' hits do nothing to capital ship hulls or shields; Y-wing and TIE bomber packs make bombing runs on
; capital ships only, at 40% damage; capital ships' passive damage and weak-point hull damage are off.
; A starting point: tune the creep damage, the bombers' hull and the packs to taste.
; Everyone in a match must use the same profile.
[rules]
no_zero_throttle_pinball=0
no_multidrift=1
fix_zavian_creep_pack=1
player_capital_hull_damage=0
player_capital_shields=0

[creep]
