rebel_pack2=ywing
rebel_pack3=ywing
imperial_pack1=tiebomber
imperial_pack2=tiebomber
imperial_pack3=tiebomber
aggressive=1
missiles=1
torpedoes=0
wingmen=1
bot_handling=1
capital_damage=40
torpedo_lock_min=150
bomber_capital_only=1

