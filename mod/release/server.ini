; STAR WARS: Squadrons community server mod: settings. Read when the game starts.
; One file for hosting and joining:
;   HOST: leave join= empty.
;   JOIN: put the host's address after join= (for example their Tailscale address, 100.x.y.z). Port 25200 is added.

[server]
join=

; Host only: what your match really is, whatever you start in the menu (always start a solo custom match vs AI).
;   fleet = Fleet Battles (PvP), coop = co-op vs AI, solo = solo vs AI, dogfight = Dogfight
match_mode=fleet

; The profile in profiles\<name>.ini: its rules, fixes and changed values. Everyone in a match must use the same one.
;   Default = the game as shipped (built in, no file needed)
profile=Default

; 1 = every ship component and cosmetic counts as owned (uses unlock_ids.txt)
all_unlocked=1
; 1 = skip the game's "lost connection to EA servers" error (code 327), which also locks the loadout screen
suppress_backend_lost=1

; Network: real UDP on all interfaces, packets small enough for Tailscale. Leave these as they are.
transport=udp
udp_bind=0.0.0.0
udp_max_packet=1200
listen=1
join_remote=1
join_local_server=0
dedicated=0
force_local_backend=0

; Logging (the logs folder beside this file): connection counts are useful when something goes wrong.
socket_log=1
bundle_log=0
; Flight data for testing changes to the mod (30-50 MB a match). The settings app has a checkbox for it.
record=0
