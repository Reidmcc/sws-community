; Stand-in limits for the test target (made-up ranges, not game data). The test run copies this to build\limits.ini.
; blastdamage's max is below the StandIn profile's 3000 on purpose: it must be clamped to 2500 everywhere.
; The laser is a primary: if it were taken for aux, its fire interval 0.1 would be clamped up to the aux floor 0.5.
; The power level is locked: the StandIn profile's change to it must not be applied.
; The Star Destroyer's movement is in [capital]: its 400 passes its own pool's 500, the fighters' 300 would clamp it.
