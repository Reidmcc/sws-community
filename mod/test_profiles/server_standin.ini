; Stand-in test config (mod/run_standin.sh copies it to build\server.ini for the test, then puts yours back).
; Dedicated mode, the stand-in profile, recording and material logging on.
[server]
material_log=1
spawn_log=1
hit_log=1
record=1
profile=StandIn
; 1 = make the game run as a dedicated server from startup (0 = normal game, for observing)
dedicated=1
; 1 = always use the Local online backend (Blaze/LAN server backends are cooked out of this build)
force_local_backend=1
socket_log=1
all_unlocked=1
transport=udp

[spawn]
; what the dedicated server loads: the game's own custom-match setup (observed in a solo custom match, 2026-10-19)
root_level=Game/Levels/RootLevel/RootLevel
lobby_level=LiveService/Levels/PvP/CustomGames/CustomMatchWaitingRoom/CustomMatchWaitingRoom
map_level=Game/Levels/PvP/PVP_Yavin/PVP_Yavin
options=GameMode=Frontline_Bots;SquadronComposition=Solo
levelsetup_int10=0
levelsetup_int14=0
; milliseconds after the game simulation starts ticking
delay_ms=3000
; 0 = non-dedicated spawn: tested 2026-10-20 00:14, crashes (create-server needs gameSim+0xD0, a client-side object)
; 2026-10-20: that block's data-loading wait crashed in the engine's own corrupt-block check (0xdeadbabe), so test without it.
spawn_dedicated=1
; 1 = skip Server::init's dedicated-only bundle-load job and its wait (crashed in the engine's data decoder, 2026-10-20 00:10)
skip_server_job=1
; 1 = load Systems/FrostbiteStartupData before spawning, as the client constructor does (no client exists in a dedicated process)
load_startup_data=1
; 1 = also load game/incomgameconfiguration ourselves before spawning, as the client does (2026-10-20 experiment)
load_game_config=1
; 1 = after the spawn, post the load-level message (FUN_140ba0c20) with the LevelSetup, as the backend would (2026-10-20)
post_load_level=1
; 0 = force ServerSettings.ThreadingEnable off after the spawn (Kyber does this on BF2); level loads raced with it on
server_threading=0

[hitbox]
ywing=0.5
