; Example profile. Copy to profiles\Example.ini beside sws_server.dll and set profile=Example in server.ini.
; Everyone in a match must use the same profile: its fingerprint is part of the network version,
; and players on different profiles are refused at connect.

[rules]
; 1 = the exploit is removed. Missing = 0 (off).
no_zero_throttle_pinball=0
no_multidrift=1
; 1 = Zavian Abyss's middle X-wing creep pack spawns all 5 ships (a mistake in the map's data)
fix_zavian_creep_pack=0

[values]
; <asset>.<field>=<number>, names as in defaults.ini (written beside the DLL each launch). Part of the fingerprint.
; starshipmovementconfig_xwing.afterburnermaxspeed=250
